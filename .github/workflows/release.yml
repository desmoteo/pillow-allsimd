name: Release

# Pillow-AllSIMD's source package and arm64 wheels, published with trusted
# publishing (no token): a tag named allsimd-* uploads them to PyPI, a
# manual run to TestPyPI. No x86 wheels: pip would choose one over the
# source package, and x86 users would get SSE4.1 instead of building AVX2
# (design/PLAN.md).

on:
  push:
    tags:
      - "allsimd-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # the source package and 7 CPython wheels for each of the 3 arm64 platforms
  EXPECTED_DISTS: 22
  FORCE_COLOR: 1

jobs:
  sdist:
    if: github.repository == 'desmoteo/pillow-allsimd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Build the source package
        run: |
          python3 -m pip install build check-manifest twine
          python3 -m build --sdist
          python3 -m twine check --strict dist/*
          python3 -m check_manifest

      - name: Check the version against the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "exec(open('src/PIL/_version.py').read()); print(__version__)")
          [ "$TAG" = "allsimd-$version" ] || { echo "tag $TAG, version $version"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    if: github.repository == 'desmoteo/pillow-allsimd'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "manylinux_2_28 aarch64"
            platform: linux
            os: ubuntu-24.04-arm
            cibw_arch: aarch64
            build: "*manylinux*"
          - name: "musllinux aarch64"
            platform: linux
            os: ubuntu-24.04-arm
            cibw_arch: aarch64
            build: "*musllinux*"
          - name: "macOS arm64"
            platform: macos
            os: macos-latest
            cibw_arch: arm64
            macosx_deployment_target: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install cibuildwheel
        run: |
          python3 -m pip install -r .ci/requirements-cibw.txt

      # The tests that pyproject.toml's [tool.cibuildwheel] runs in each
      # wheel include the SIMD consistency tests.
      - name: Build and test wheels
        run: |
          python3 -m cibuildwheel --output-dir wheelhouse 2>&1 | tee build.log
        shell: bash
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ENVIRONMENT_PASS_LINUX: FORCE_COLOR
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}

      - name: Check that every wheel has the NEON kernels
        run: |
          wheels=$(ls wheelhouse/*.whl | wc -l)
          neon=$(grep -c -- "--- SIMD kernels: NEON$" build.log || true)
          echo "$wheels wheels, $neon NEON builds"
          [ "$wheels" -gt 0 ] && [ "$neon" -eq "$wheels" ]
        shell: bash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  count-dists:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    name: Count dists
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: "What did we get?"
        run: |
          ls -l dist
          files=$(ls dist | wc -l)
          echo "$files dists, expected $EXPECTED_DISTS"
          [ "$files" -eq "$EXPECTED_DISTS" ]

  testpypi-publish:
    if: github.event_name == 'workflow_dispatch'
    needs: count-dists
    runs-on: ubuntu-latest
    name: Upload to TestPyPI
    environment:
      name: release-testpypi
      url: https://test.pypi.org/p/pillow-allsimd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  pypi-publish:
    if: github.event_name == 'push'
    needs: count-dists
    runs-on: ubuntu-latest
    name: Upload to PyPI
    environment:
      name: release-pypi
      url: https://pypi.org/p/pillow-allsimd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
