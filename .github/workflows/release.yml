name: Release

# Pillow-AllSIMD's source package and wheels, published with trusted
# publishing (no token): a tag named allsimd-* uploads them to PyPI, a
# manual run to TestPyPI. The x86-64 wheels hold the SSE4.1, AVX2 and
# AVX-VNNI kernels and choose at run time (design/SIMD_DISPATCH_PLAN.md);
# the arm64 wheels have NEON.
#
# The platforms built, and so the files uploaded, come from the tag's
# suffix or the manual run's input: allsimd-<version> builds everything;
# allsimd-<version>-linux the source package and the Linux wheels;
# allsimd-<version>-macos the macOS wheels only. PyPI accepts more files
# for a version it already has, so when GitHub has no macOS runners the
# Linux files ship first and the macOS wheels follow under their own tag
# (design/REVIEW_2026-11.md, finding 9). Every file of a version has the
# same SBOM, Pillow's renamed for this package (.github/allsimd_sbom.py).

on:
  push:
    tags:
      - "allsimd-*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "all, linux (source package and Linux wheels) or macos (macOS wheels)"
        type: choice
        options: [all, linux, macos]
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # CPython 3.11 to 3.15 and 3.14t, 3.15t: pyproject.toml's [tool.cibuildwheel]
  WHEELS_PER_PLATFORM: 7
  FORCE_COLOR: 1

jobs:
  plan:
    if: github.repository == 'desmoteo/pillow-allsimd'
    runs-on: ubuntu-latest
    name: Plan
    outputs:
      sdist: ${{ steps.plan.outputs.sdist }}
      wheels: ${{ steps.plan.outputs.wheels }}
      expected: ${{ steps.plan.outputs.expected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the platforms and check the version against the tag
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          PLATFORMS: ${{ inputs.platforms }}
        run: python3 .github/release_plan.py >> "$GITHUB_OUTPUT"

  sbom:
    needs: plan
    runs-on: ubuntu-latest
    name: Generate SBOM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Generate CycloneDX SBOM
        run: python3 .github/allsimd_sbom.py

      - name: Validate SBOM
        run: |
          python3 -m pip install -r .ci/requirements-sbom.txt
          check-jsonschema --schemafile "https://raw.githubusercontent.com/CycloneDX/specification/1.7/schema/bom-1.7.schema.json" pillow_allsimd-*.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: "pillow_allsimd-*.cdx.json"

  sdist:
    needs: plan
    if: needs.plan.outputs.sdist == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Build the source package
        run: |
          python3 -m pip install build check-manifest twine
          python3 -m build --sdist
          python3 -m twine check --strict dist/*
          python3 -m check_manifest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    needs: [plan, sbom]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.wheels) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install cibuildwheel
        run: |
          python3 -m pip install -r .ci/requirements-cibw.txt

      # The tests that pyproject.toml's [tool.cibuildwheel] runs in each
      # wheel include the SIMD consistency tests.
      - name: Build and test wheels
        run: |
          python3 -m cibuildwheel --output-dir wheelhouse 2>&1 | tee build.log
        shell: bash
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ENVIRONMENT_PASS_LINUX: FORCE_COLOR
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}

      - name: Check that every wheel has the platform's SIMD kernels
        run: |
          wheels=$(ls wheelhouse/*.whl | wc -l)
          builds=$(grep -c -- "--- SIMD kernels: $KERNELS\$" build.log || true)
          echo "$wheels wheels, $builds builds with '$KERNELS', $WHEELS_PER_PLATFORM expected"
          [ "$wheels" -eq "$WHEELS_PER_PLATFORM" ] && [ "$builds" -eq "$wheels" ]
        shell: bash
        env:
          KERNELS: ${{ matrix.kernels }}

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom

      - name: Embed SBOM in wheels
        run: python3 .github/embed-sbom.py wheelhouse sbom

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  count-dists:
    # The source package job is skipped for a macOS-only release
    needs: [plan, sdist, wheels]
    if: >-
      !cancelled() && needs.wheels.result == 'success'
      && (needs.sdist.result == 'success' || needs.sdist.result == 'skipped')
    runs-on: ubuntu-latest
    name: Count dists
    env:
      EXPECTED_DISTS: ${{ needs.plan.outputs.expected }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: "What did we get?"
        run: |
          ls -l dist
          files=$(ls dist | wc -l)
          echo "$files dists, expected $EXPECTED_DISTS"
          [ "$files" -eq "$EXPECTED_DISTS" ]

  testpypi-publish:
    # (a skipped source package job, in a macOS-only run, would otherwise
    # skip this job too: the implicit success() looks at every earlier job)
    if: >-
      !cancelled() && needs.count-dists.result == 'success'
      && github.event_name == 'workflow_dispatch'
    needs: count-dists
    runs-on: ubuntu-latest
    name: Upload to TestPyPI
    environment:
      name: release-testpypi
      url: https://test.pypi.org/p/pillow-allsimd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  pypi-publish:
    # (as above: 13.0.0.post4's first macOS run built its wheels and skipped
    # the upload)
    if: >-
      !cancelled() && needs.count-dists.result == 'success'
      && github.event_name == 'push'
    needs: count-dists
    runs-on: ubuntu-latest
    name: Upload to PyPI
    environment:
      name: release-pypi
      url: https://pypi.org/p/pillow-allsimd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
