name: Test Valgrind Memory Leaks

# like the Docker tests, but running valgrind only on *.c/*.h changes.

# this is very expensive. Only run on the pull request.
on:
  # Pushes run this only when the workflow or its script changes (it takes
  # about two hours); pull requests also run it for C changes. A push also
  # registers it with GitHub, which "gh workflow run" needs on a fork.
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/test-valgrind-memory.yml"
      - "depends/docker-test-valgrind-memory.sh"
  pull_request:
    paths:
      - ".github/workflows/test-valgrind-memory.yml"
      - "**.c"
      - "**.h"
      - "depends/docker-test-valgrind-memory.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        docker: [
          ubuntu-24.04-noble-amd64-valgrind,
        ]
        dockerTag: [main]
        # Optimized SIMD builds. Valgrind in the image runs SSE4 and AVX2
        # but not AVX-VNNI or AVX-512, so no avxvnni or native builds.
        simd: [sse4, avx2]
        split: [1, 2, 3, 4]

    name: ${{ matrix.docker }} SIMD ${{ matrix.simd }} ${{ matrix.split }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build system information
      run: python3 .github/workflows/system-info.py

    - name: Docker pull
      run: |
        docker pull pythonpillow/${{ matrix.docker }}:${{ matrix.dockerTag }}

    - name: Build and Run Valgrind
      run: |
        # The Pillow user in the docker container is UID 1001
        sudo chown -R 1001 $GITHUB_WORKSPACE
        docker run --name pillow_container -e "PILLOW_VALGRIND_TEST=true" \
            -e SIMD=${{ matrix.simd }} -e OPTIMIZE=-O2 \
            -e "SPLIT_COUNT=4" -e "SPLIT_INDEX=${{ matrix.split }}" \
            -v $GITHUB_WORKSPACE:/Pillow pythonpillow/${{ matrix.docker }}:${{ matrix.dockerTag }} /Pillow/depends/docker-test-valgrind-memory.sh
        sudo chown -R runner $GITHUB_WORKSPACE
